<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table {
            width: 600px;
            border: solid 1px black;
            border-collapse: collapse;
        }

        tr,
        td {
            border: solid 1px black;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <td>Nome</td>
                <td>Idade</td>
                <td>País</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alan Turing</td>
                <td>27</td>
                <td>Inglaterra</td>
            </tr>
            <tr>
                <td>Luís Miguel</td>
                <td>15</td>
                <td>Brasil</td>
            </tr>
            <tr>
                <td>Genivaldo</td>
                <td>32</td>
                <td>Brasil</td>
            </tr>
        </tbody>
    </table>

    <br><a href="https://luismigueldasilvapacheco.github.io/Portfolio-html-css/projetos.html">Voltar</a>
</body>
</html>
